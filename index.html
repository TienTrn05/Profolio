<!doctype html>
<html lang="en" class="no-js" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ff" />
    <meta
      name="description"
      content="Portfolio of Trần Ngọc Tiến, a full-stack developer building Flutter and React interfaces with Node.js APIs and SQL data."
    />
    <meta name="author" content="Trần Ngọc Tiến" />
    <meta name="robots" content="index, follow" />
    <script>
      try {
        const savedTheme = localStorage.getItem("tien-portfolio-theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            savedTheme === "dark" ? "#050816" : "#f7f4ff",
          );
        const savedMotion = localStorage.getItem("tien-portfolio-motion");
        document.documentElement.dataset.motion =
          savedMotion === "full" || savedMotion === "reduced"
            ? savedMotion
            : matchMedia("(prefers-reduced-motion: reduce)").matches
              ? "reduced"
              : "full";
      } catch {
        document.documentElement.dataset.theme = "light";
        document.documentElement.dataset.motion = "full";
      }
    </script>
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Trần Ngọc Tiến — Student Software Developer"
    />
    <meta
      property="og:description"
      content="Full-stack student projects built with Flutter, React, Node.js APIs and SQL data."
    />
    <meta property="og:image" content="assets/images/og-cover.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Trần Ngọc Tiến — Student Software Developer"
    />
    <meta
      name="twitter:description"
      content="Student portfolio featuring Flutter, React and Node.js full-stack projects."
    />
    <meta name="twitter:image" content="assets/images/og-cover.jpg" />
    <title>Trần Ngọc Tiến — Student Software Developer</title>
    <link
      rel="icon"
      href="assets/icons/tien-rooster-mark.svg"
      type="image/svg+xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
