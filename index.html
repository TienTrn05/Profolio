    <meta

    <meta

    <meta name="twitter:image" content="assets/images/og-cover.jpg" />

    <link
      rel="icon"
      href="assets/icons/tien-rooster-mark.svg"
      type="image/svg+xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      let savedTheme;
      let savedMotion;
      try {
        savedTheme = localStorage.getItem("tien-portfolio-theme");
        savedMotion = localStorage.getItem("tien-portfolio-motion");
      } catch {
        // Browser storage may be unavailable.
      }
      const theme = savedTheme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.motion =
        savedMotion === "full" || savedMotion === "reduced"
          ? savedMotion
          : matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "reduced"
            : "full";
      document.querySelector('meta[name="theme-color"]').content =
        theme === "dark" ? "#050816" : "#f7f4ff";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
